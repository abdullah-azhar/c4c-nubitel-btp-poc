# Non-secret settings for the BTP lean view. Same meaning as the env block in
# manifest.yml (Cloud Foundry). Lists are comma-separated, no spaces needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: c4c-lean-view-config
data:
  # Only the (mock) Nubitel may postMessage to the view.
  MESSAGE_ORIGINS: "https://c4c-nubitel-btp-poc.vercel.app"
  # Browsers check the whole ancestor chain: Nubitel AND the C4C tenant.
  # After changing this file: kubectl apply -k kyma/ && kubectl rollout restart deploy/c4c-lean-view -n c4c-poc
  FRAME_ANCESTORS: "https://c4c-nubitel-btp-poc.vercel.app,https://my335945.crm.ondemand.com"
  C4C_UI_URL: "https://my335945.crm.ondemand.com"
  # Keep mock until the C4C queries are confirmed. Never real customer data on a trial account.
  DATA_SOURCE: "mock"
  SECTION_TIMEOUT_MS: "6000"
  # How long (seconds) the view reuses what it loaded when the agent switches back to a chat. 0 = off.
  CACHE_TTL_SECONDS: "300"
  # C4C tenant for the OData adapter (used only when DATA_SOURCE is "c4c"). Credentials are NOT here:
  # they go in the secret c4c-odata-credentials, see docs/C4C-ODATA.md.
  C4C_BASE_URL: "https://my335945.crm.ondemand.com"
  # Nubitel sends the External ID of the conversation = the ID of its C4C phone call activity.
  # This is the PhoneCall field it is matched on: "ID" is the activity ID shown in C4C. Empty = find the customer by phone number only.
  # If the activity is not found, the view falls back to the phone number by itself.
  C4C_ACTIVITY_FIELD: "ID"
  # Recommendations are this month's snapshot. The test tenant has no snapshot for the current month, so for testing
  # show the newest earlier one, labelled "(latest available)". Set to "false" to show only the current month.
  C4C_RECO_FALLBACK_LATEST: "true"
  # Lets agents create a contact or save the caller's number on a contact (unknown-caller screen).
  # Mock data only for now. Review this before switching DATA_SOURCE to "c4c".
  ALLOW_WRITES: "true"
  # The open-in-C4C icons build their links from C4C_UI_URL (account, contact, sales order and task, copied from real C4C links).
  # Only for a tenant that signs in with single sign-on: set C4C_LINK_BASE to the part of a real C4C link before the "#",
  # without saml2=disabled. Leave unset for the test tenant.
  # C4C_LINK_BASE: ""
  # Timing footer for testing. Leave off for agents.
  SHOW_DIAGNOSTICS: "false"
